<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Redes sociales oficiales de 1D4BAND. Pop rock en directo.">
  <title>1D4BAND | Web oficial</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101014;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }
    main { width: 100%; max-width: 460px; }
    h1 {
      font-size: clamp(42px, 12vw, 64px);
      letter-spacing: 3px;
      margin: 0 0 8px;
    }
    .subtitle {
      color: #e63946;
      letter-spacing: 3px;
      font-weight: bold;
    }
    .intro { margin: 35px 0 25px; color: #ccc; }
    .social {
      display: block;
      padding: 19px;
      margin: 15px 0;
      background: #202027;
      color: white;
      border: 1px solid #45454d;
      border-radius: 12px;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      transition: background .2s, transform .2s;
    }
    .social:hover, .social:focus-visible {
      background: #bd2633;
      transform: translateY(-2px);
    }
    footer {
      margin-top: 45px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>1D4BAND</h1>
    <p class="subtitle">POP ROCK EN DIRECTO</p>
    <p class="intro">¡Síguenos y disfruta de nuestra música!</p>

    <a class="social"
       href="https://www.instagram.com/1d4band/"
       target="_blank" rel="noopener noreferrer">
       INSTAGRAM
    </a>

    <a class="social"
       href="https://www.facebook.com/1d4band"
       target="_blank" rel="noopener noreferrer">
       FACEBOOK
    </a>

    <a class="social"
       href="https://www.youtube.com/@1d4band"
       target="_blank" rel="noopener noreferrer">
       YOUTUBE
    </a>

    <footer>
      1D4BAND · Música en directo
    </footer>
  </main>
</body>
</html>
